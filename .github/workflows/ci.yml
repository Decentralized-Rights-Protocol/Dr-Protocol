name: DRP Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Build verification node
        run: go build ./cmd/drpd
      - name: Build Go CLI
        run: go build ./cmd/drp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test npm CLI
        working-directory: npm-cli
        run: |
          node --check src/index.js
          npm test
          npm pack --dry-run
