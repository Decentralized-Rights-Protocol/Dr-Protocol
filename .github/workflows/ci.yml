name: DRP Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build node
        run: go build ./cmd/drpd
      - name: Build CLI
        run: go build ./cmd/drp
